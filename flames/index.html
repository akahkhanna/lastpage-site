<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>/* Old addresses: the GitHub copy goes straight to thatlastpage.app; the old vercel.app address
   brings this browser's saved bits (address, name, families, puzzle results) along, once. */
(function(){var h=location.hostname,to=location.pathname+location.search+location.hash;
if(h==="akahkhanna.github.io"){location.replace("https://thatlastpage.app"+to.replace(/^\/lastpage-site/,""));return}
if(h==="thatlastpage.vercel.app"){var d={};try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf("lp.")===0)d[k]=localStorage.getItem(k)}}catch(e){}
location.replace("https://thatlastpage.app/move.html#"+encodeURIComponent(JSON.stringify({d:d,to:to})));
document.write('<plaintext style="display:none">')/* the rest of the old page never runs */}})()</script>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FLAMES · That Last Page</title>
<meta name="description" content="Someone did FLAMES with your name. Open it to see what you got, then try your own.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="That Last Page">
<meta property="og:title" content="Someone did FLAMES with your name…">
<meta property="og:description" content="Open it to see what you got. Then try your own.">
<meta property="og:image" content="https://thatlastpage.app/flames/preview.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">

<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<meta name="theme-color" content="#fbf8f0">
<script>if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}))</script>
<link rel="stylesheet" href="/site.css">
<link rel="stylesheet" href="flames.css">
</head>
<body>
<header class="site-header">
  <div class="wrap header-row">
    <a class="wordmark" href="/games/"><span class="brand-mark" aria-hidden="true"></span>That Last Page</a>
    <nav class="site-nav" aria-label="Pages">
      <a href="/games/" aria-current="page">Games</a>
      <a href="/board/">Family board</a>
    </nav>
  </div>
</header>
<main class="sheet"><div class="wrap content game-page"><a class="back" href="/games/">← Games</a>

  <header>
    <h1>FLAMES</h1>
    <p class="pencil" id="intro"></p>
  </header>

  <section id="form" hidden>
    <label><span class="pencil">your name</span><input autocorrect="off" spellcheck="false" data-form-type="other" id="first" autocomplete="off" autocapitalize="characters" maxlength="24" enterkeyhint="next"></label>
    <label><span class="pencil">their name</span><input autocorrect="off" spellcheck="false" data-form-type="other" id="second" autocomplete="off" autocapitalize="characters" maxlength="24" enterkeyhint="go"></label>
    <button id="go" class="ink" disabled>work it out →</button>
  </section>

  <section id="working" hidden aria-live="polite">
    <div class="name" id="nameA"></div>
    <div class="name" id="nameB"></div>
    <div class="count" id="count"></div>
    <div class="flames" id="flames"></div>
    <div class="answer" id="answer"></div>
    <div class="reaction pencil" id="reaction"></div>
    <p class="pencil skip" id="skip">tap to skip</p>
  </section>

  <section id="after" hidden>
    <button id="send" class="red">send it to them →</button>
    <p class="pencil" id="copied" hidden>link copied!! paste it in the chat</p>
    <button id="again" class="ink small">try your own</button>
  </section>

  

<footer class="page-footer"><a href="/games/">Games</a><a href="/board/">Family board</a><a href="https://apps.apple.com/app/id6831963769">The app, on iPhone</a><a href="/privacy.html">Privacy</a><a href="/help/">Help</a></footer>
</div></main>
<script src="rules.js"></script>
<script src="flames.js"></script>
<script src="/push.js"></script>
</body>
</html>
