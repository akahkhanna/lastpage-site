<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>if(location.hostname==="akahkhanna.github.io"){location.replace("https://thatlastpage.vercel.app"+location.pathname.replace(/^\/lastpage-site/,"")+location.search+location.hash)}</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sudoku – That Last Page</title>
<meta name="description" content="Today's sudoku: fill every row, column and box with 1 to 9. Same puzzle for everyone today.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="That Last Page">
<meta property="og:title" content="Today's sudoku — can you beat my time?">
<meta property="og:description" content="Fill every row, column and box with 1 to 9. No app needed.">
<meta name="theme-color" content="#fbfaf6">
<link rel="stylesheet" href="test.css">
<style>
  #grid { width: 100%; max-width: 420px; aspect-ratio: 1; display: grid; grid-template-columns: repeat(9, 1fr); margin: 10px 0; border: 2px solid #24377e; background: #fbfaf6; box-sizing: border-box; }
  #grid button { all: unset; display: flex; align-items: center; justify-content: center; font: 400 clamp(18px, 6vw, 28px) Kalam, cursive; color: #5f5f5f; border-right: 1px solid rgba(95,95,95,.3); border-bottom: 1px solid rgba(95,95,95,.3); cursor: pointer; aspect-ratio: 1; }
  #grid button.given { color: #24377e; font-weight: 700; cursor: default; }
  #grid button.br { border-right: 2px solid #24377e; }
  #grid button.bb { border-bottom: 2px solid #24377e; }
  #grid button.related { background: rgba(36,55,126,.06); }
  #grid button.same { background: rgba(184,50,42,.12); }
  #grid button.sel { background: rgba(36,55,126,.2); }
  #grid button.clash { color: #b8322a; text-decoration: underline wavy #b8322a; }
  #grid button.hinted { color: rgba(184,50,42,.8); }
  #pad { display: flex; gap: 4px; max-width: 420px; }
  #pad button { all: unset; flex: 1; text-align: center; min-height: 44px; line-height: 44px; font: 700 24px Kalam, cursive; color: #24377e; cursor: pointer; }
  #pad button.used { color: rgba(95,95,95,.35); }
  .done { color: var(--red); font-weight: 700; font-size: 30px; transform: rotate(-3deg); transform-origin: left; margin: 6px 0; }
</style>
</head>
<body>
<main>
  <h1 id="title">SUDOKU</h1>
  <p>Fill every row, column and box with 1 to 9.</p>
  <div id="grid" role="grid" aria-label="Sudoku grid"></div>
  <div id="pad"></div>
  <p class="pencil" id="status"></p>
  <div id="after" hidden>
    <p class="done" id="done"></p>
    <button class="go" id="share">send my time →</button>
    <p class="pencil" id="copied" hidden>copied!! paste it in the chat</p>
    <p><a href="dots.html" style="color:var(--ink);font-weight:700">today's dot to dot →</a></p>
  </div>
  <footer>
    <a class="app" href="https://apps.apple.com/app/id6831963769">Get the whole notebook (with the teacher!) on iPhone →</a>
    <p class="small">Nothing you write here is sent anywhere. <a href="../privacy.html">Privacy</a></p>
  </footer>
</main>
<script src="sudoku.js"></script>
<script>
(function () {
  const S = window.Sudoku;
  const dayFor = (d) => Math.max(0, Math.round((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - Date.UTC(2026, 10, 1)) / 86400000));
  const today = dayFor(new Date());
  const fromLink = parseInt(location.hash.slice(1), 10);
  const day = fromLink >= 1 && fromLink - 1 <= today ? fromLink - 1 : today;
  const p = S.make(day);
  document.getElementById("title").textContent = "SUDOKU #" + p.number;
  const key = "lp.sudoku." + day;
  let grid = p.givens.slice(), sel = null, started = null, doneSecs = null;
  try { const s = JSON.parse(localStorage.getItem(key) || "null"); if (s) { grid = p.solution.slice(); doneSecs = s; } } catch {}

  const gridEl = document.getElementById("grid"), padEl = document.getElementById("pad");
  const cells = [...Array(81)].map((_, i) => {
    const b = document.createElement("button");
    if (i % 9 === 2 || i % 9 === 5) b.classList.add("br");
    if (Math.floor(i / 9) === 2 || Math.floor(i / 9) === 5) b.classList.add("bb");
    if (p.givens[i]) b.classList.add("given");
    b.setAttribute("aria-label", `row ${Math.floor(i / 9) + 1}, column ${(i % 9) + 1}`);
    b.addEventListener("click", () => { if (doneSecs) return; sel = i; draw(); });
    gridEl.appendChild(b); return b;
  });
  const keys = [1, 2, 3, 4, 5, 6, 7, 8, 9, 0].map((d) => {
    const b = document.createElement("button");
    b.textContent = d ? String(d) : "⌫";
    b.setAttribute("aria-label", d ? "write " + d : "rub out");
    b.addEventListener("click", () => write(d));
    padEl.appendChild(b); return b;
  });
  addEventListener("keydown", (e) => {
    if (e.key >= "1" && e.key <= "9") write(+e.key);
    else if (e.key === "Backspace" || e.key === "Delete" || e.key === "0") write(0);
  });

  function write(d) {
    if (doneSecs || sel === null || p.givens[sel]) return;
    if (!started) started = Date.now();
    grid[sel] = grid[sel] === d ? 0 : d;   // the same number again rubs it out
    draw();
    if (grid.every((v, i) => v === p.solution[i])) finish();
  }
  function draw() {
    const clash = S.clashes(grid);
    cells.forEach((b, i) => {
      b.textContent = grid[i] ? String(grid[i]) : "";
      b.classList.toggle("sel", sel === i);
      b.classList.toggle("related", sel !== null && sel !== i && S.peers[sel].includes(i));
      b.classList.toggle("same", sel !== null && sel !== i && grid[i] && grid[sel] === grid[i]);
      b.classList.toggle("clash", clash.has(i) && !p.givens[i]);
    });
    keys.forEach((b, k) => b.classList.toggle("used", k < 9 && grid.filter((v) => v === k + 1).length >= 9));
    padEl.hidden = !!doneSecs;
    const left = grid.filter((v) => !v).length;
    document.getElementById("status").textContent = doneSecs ? "" : sel === null ? "tap a square, then a number" : `${left} squares to go`;
  }
  function finish() {
    doneSecs = Math.max(1, Math.round((Date.now() - (started || Date.now())) / 1000));
    try { localStorage.setItem(key, JSON.stringify(doneSecs)); } catch {}
    sel = null; draw(); showDone();
  }
  const clock = (s) => Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  function showDone() {
    document.getElementById("done").textContent = `done in ${clock(doneSecs)} ✓`;
    document.getElementById("after").hidden = false;
  }
  document.getElementById("share").addEventListener("click", async () => {
    const text = `Sudoku #${p.number} ✓ in ${clock(doneSecs)}. Can you beat me?`;
    const url = location.origin + location.pathname + "#" + p.number;
    if (navigator.share) { try { await navigator.share({ text, url }); return; } catch (e) { if (e.name === "AbortError") return; } }
    try { await navigator.clipboard.writeText(text + " " + url); } catch { prompt("Copy this:", text + " " + url); return; }
    const c = document.getElementById("copied"); c.hidden = false; setTimeout(() => (c.hidden = true), 2500);
  });
  draw(); if (doneSecs) showDone();
})();
</script>
</body>
</html>
