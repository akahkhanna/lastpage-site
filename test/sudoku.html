<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>if(location.hostname==="akahkhanna.github.io"){location.replace("https://thatlastpage.vercel.app"+location.pathname.replace(/^\/lastpage-site/,"")+location.search+location.hash)}</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mini sudoku · That Last Page</title>
<meta name="description" content="Today's mini sudoku: fill every row, column and box with 1 to 6. Same puzzle for everyone today.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="That Last Page">
<meta property="og:title" content="Today's mini sudoku — can you beat my time?">
<meta property="og:description" content="Fill every row, column and box with 1 to 6. No app needed.">


<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<meta name="theme-color" content="#fbf8f0">
<script>if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}))</script>
<link rel="stylesheet" href="/site.css">
<style>
  #grid { width: 100%; max-width: 360px; aspect-ratio: 1; display: grid; grid-template-columns: repeat(6, 1fr); margin: 14px 0; border: 2px solid var(--ink); background: var(--card); border-radius: 6px; overflow: hidden; }
  #grid button { all: unset; display: flex; align-items: center; justify-content: center; font: 400 clamp(18px, 6vw, 28px) var(--display); color: var(--muted); border-right: 1px solid #c9c0ae; border-bottom: 1px solid #c9c0ae; cursor: pointer; aspect-ratio: 1; }
  #grid button.given { color: var(--ink); font-weight: 700; cursor: default; }
  #grid button.br { border-right: 2px solid var(--ink); }
  #grid button.bb { border-bottom: 2px solid var(--ink); }
  #grid button.related { background: #f3eee2; }
  #grid button.same { background: #f1dcd6; }
  #grid button.sel { background: #e4e8ef; }
  #grid button.clash { color: var(--red); text-decoration: underline wavy var(--red); }
  #grid button.hinted { color: var(--red); }
  #pad { display: flex; gap: 6px; max-width: 360px; }
  #pad button { all: unset; flex: 1; text-align: center; min-height: 44px; line-height: 44px; font: 700 22px var(--display); color: var(--ink); background: var(--card); border: 1px solid var(--border); border-radius: 6px; cursor: pointer; }
  #pad button.used { color: #b9b2a4; }
</style>
</head>
<body>
<header class="site-header">
  <div class="wrap header-row">
    <a class="wordmark" href="/games/"><span class="brand-mark" aria-hidden="true"></span>That Last Page</a>
    <nav class="site-nav" aria-label="Pages">
      <a href="/games/" aria-current="page">Games</a>
      <a href="/board/">Family board</a>
    </nav>
  </div>
</header>
<main class="sheet"><div class="wrap content game-page"><a class="back" href="/games/">← Games</a>

  <h1 id="title">Mini sudoku</h1>
  <p>Fill every row, column and box with 1 to 6.</p>
  <div id="grid" role="grid" aria-label="Sudoku grid"></div>
  <div id="pad"></div>
  <p class="pencil" id="status"></p>
  <div id="after" hidden>
    <p class="done" id="done"></p>
    <button class="go" id="share">send a challenge link →</button>
    <p class="pencil" id="copied" hidden>copied!! paste it in the chat</p>
    <p class="small" id="next"></p>
  </div>
  

<footer class="page-footer"><a href="/games/">Games</a><a href="/board/">Family board</a><a href="https://apps.apple.com/app/id6831963769">The app, on iPhone</a><a href="/privacy.html">Privacy</a><a href="/">Help</a></footer>
</div></main>
<script src="sudoku.js"></script>
<script src="dare.js"></script>
<script>
(function () {
  const S = window.Sudoku;
  const dayFor = (d) => Math.max(0, Math.round((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - Date.UTC(2026, 10, 1)) / 86400000));
  const today = dayFor(new Date());
  const fromLink = parseInt(location.hash.slice(1), 10);
  const day = fromLink >= 1 && fromLink - 1 <= today ? fromLink - 1 : today;
  const p = S.make(day);
  document.getElementById("title").textContent = "Mini sudoku #" + p.number;
  const key = "lp.minisudoku." + day;
  let grid = p.givens.slice(), sel = null, started = null, doneSecs = null;
  try { const s = JSON.parse(localStorage.getItem(key) || "null"); if (s) { grid = p.solution.slice(); doneSecs = s; } } catch {}

  const gridEl = document.getElementById("grid"), padEl = document.getElementById("pad");
  const N = S.N;
  const cells = [...Array(S.CELLS)].map((_, i) => {
    const b = document.createElement("button");
    const r = Math.floor(i / N), c = i % N;
    if (c % S.BC === S.BC - 1 && c < N - 1) b.classList.add("br");
    if (r % S.BR === S.BR - 1 && r < N - 1) b.classList.add("bb");
    if (p.givens[i]) b.classList.add("given");
    b.setAttribute("aria-label", `row ${r + 1}, column ${c + 1}`);
    b.addEventListener("click", () => { if (doneSecs) return; sel = i; draw(); });
    gridEl.appendChild(b); return b;
  });
  const keys = [1, 2, 3, 4, 5, 6, 0].map((d) => {
    const b = document.createElement("button");
    b.textContent = d ? String(d) : "⌫";
    b.setAttribute("aria-label", d ? "write " + d : "rub out");
    b.addEventListener("click", () => write(d));
    padEl.appendChild(b); return b;
  });
  addEventListener("keydown", (e) => {
    if (e.key >= "1" && e.key <= String(N)) write(+e.key);
    else if (e.key === "Backspace" || e.key === "Delete" || e.key === "0") write(0);
  });

  function write(d) {
    if (doneSecs || sel === null || p.givens[sel]) return;
    if (!started) started = Date.now();
    grid[sel] = grid[sel] === d ? 0 : d;   // the same number again rubs it out
    draw();
    if (grid.every((v, i) => v === p.solution[i])) finish();
  }
  function draw() {
    const clash = S.clashes(grid);
    cells.forEach((b, i) => {
      b.textContent = grid[i] ? String(grid[i]) : "";
      b.classList.toggle("sel", sel === i);
      b.classList.toggle("related", sel !== null && sel !== i && S.peers[sel].includes(i));
      b.classList.toggle("same", sel !== null && sel !== i && grid[i] && grid[sel] === grid[i]);
      b.classList.toggle("clash", clash.has(i) && !p.givens[i]);
    });
    keys.forEach((b, k) => b.classList.toggle("used", k < N && grid.filter((v) => v === k + 1).length >= N));
    padEl.hidden = !!doneSecs;
    const left = grid.filter((v) => !v).length;
    document.getElementById("status").textContent = doneSecs ? "" : sel === null ? "tap a square, then a number" : `${left} squares to go`;
  }
  function finish() {
    doneSecs = Math.max(1, Math.round((Date.now() - (started || Date.now())) / 1000));
    try { localStorage.setItem(key, JSON.stringify(doneSecs)); } catch {} Dare.post("sudoku", day, doneSecs, typeof hints === "number" ? hints : 0);
    sel = null; draw(); showDone();
  }
  const clock = (s) => Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  function showDone() { Dare.show(day, doneSecs);
    document.getElementById("done").textContent = `done in ${clock(doneSecs)} ✓`;
    document.getElementById("after").hidden = false;
  }
  document.getElementById("share").addEventListener("click", async () => {
    const text = `Mini sudoku #${p.number} ✓ in ${clock(doneSecs)}. Beat my time!`;
    const url = Dare.link(day, doneSecs);
    if (navigator.share) { try { await navigator.share({ text, url }); return; } catch (e) { if (e.name === "AbortError") return; } }
    try { await navigator.clipboard.writeText(text + " " + url); } catch { prompt("Copy this:", text + " " + url); return; }
    const c = document.getElementById("copied"); c.hidden = false; setTimeout(() => (c.hidden = true), 2500);
  });
  draw(); Dare.show(day, doneSecs); if (doneSecs) showDone();
})();
</script>
<script src="/push.js"></script>
</body>
</html>
