<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>/* Old addresses: the GitHub copy goes straight to thatlastpage.app; the old vercel.app address
   brings this browser's saved bits (address, name, families, puzzle results) along, once. */
(function(){var h=location.hostname,to=location.pathname+location.search+location.hash;
if(h==="akahkhanna.github.io"){location.replace("https://thatlastpage.app"+to.replace(/^\/lastpage-site/,""));return}
if(h==="thatlastpage.vercel.app"){var d={};try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf("lp.")===0)d[k]=localStorage.getItem(k)}}catch(e){}
location.replace("https://thatlastpage.app/move.html#"+encodeURIComponent(JSON.stringify({d:d,to:to})));
document.write('<plaintext style="display:none">')/* the rest of the old page never runs */}})()</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Surprise test · That Last Page</title>
<meta name="description" content="Today's surprise test: 5 quick questions, marked by Mrs T. Same test for everyone today.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="That Last Page">
<meta property="og:title" content="SURPRISE TEST!! Can you beat my score?">
<meta property="og:description" content="5 quick questions, marked by Mrs T. Same test for everyone today, no app needed.">

<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<meta name="theme-color" content="#fbf8f0">
<script>if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}))</script>
<link rel="stylesheet" href="/site.css">
<style>
  .q { margin: 0 0 12px; padding: 12px 14px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); }
  .words { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
  .word { justify-self: start; min-height: 40px; padding: 4px 14px; border: 1px solid var(--border); border-radius: 999px; background: #fbf7ed; cursor: pointer; }
  .word.on { border-color: var(--red); color: var(--red); font-weight: 700; }
  .ans input { width: 120px; } .ans input.wide { width: 220px; } input.gap { width: 60px; text-align: center; }
  .printed input { width: 140px; display: inline-block; }
</style>
</head>
<body>
<header class="site-header">
  <div class="wrap header-row">
    <a class="wordmark" href="/games/"><span class="brand-mark" aria-hidden="true"></span>That Last Page</a>
    <nav class="site-nav" aria-label="Pages">
      <a href="/games/" aria-current="page">Games</a>
      <a href="/board/">Family board</a>
    </nav>
  </div>
</header>
<main class="sheet"><div class="wrap content game-page"><a class="back" href="/games/">← Games</a>

  <h1><span id="title">Surprise test</span><span class="score" id="score" hidden></span></h1>
  <p class="printed">Name: <input autocomplete="off" autocorrect="off" spellcheck="false" data-form-type="other" id="name" maxlength="16" style="width:120px;font-size:15px;line-height:22px"> &nbsp; Max. marks: 10</p>
  <div id="questions"></div>
  <div id="actions">
    <button class="go" id="handIn">hand it in →</button>
  </div>
  <div id="after" hidden>
    <p class="remark" id="remark"></p>
    <p class="pencil" style="padding-left:120px">— Mrs T.</p>
    <button class="go" id="share">send my marks →</button>
    <p class="pencil" id="copied" hidden>copied!! paste it in the chat</p>
    <p class="small" id="next"></p>
  </div>
  

<footer class="page-footer"><a href="/games/">Games</a><a href="/board/">Family board</a><a href="https://apps.apple.com/app/id6831963769">The app, on iPhone</a><a href="/privacy.html">Privacy</a><a href="/help/">Help</a></footer>
</div></main>
