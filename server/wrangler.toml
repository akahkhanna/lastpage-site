APNS_KEY_ID_SANDBOX = "M2PZN5H6DN"    # LastPage push: Xcode builds
APNS_TOPIC = "com.akashkhanna.thelastpage"
VAPID_PUBLIC = "BOtULxBZnGuQc8dm9xKTsKKvK5htXlf51TCwgdzzPDdeNiwGSjUKzKW09VdvAiHqG4tmuyqVtFS0AwCcAwNjvQw"   # Web Push; public by design
# VAPID_PRIVATE (a JWK) is a secret: `wrangler secret put VAPID_PRIVATE < ~/Documents/lastpage-release/vapid-private.jwk.json`
