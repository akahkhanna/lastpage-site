# That Last Page's small server: homework by code and by address (and, later, rooms and
# family boards). Cloudflare Workers + Durable Objects, free plan. Deploy: `wrangler deploy`
# from this folder (ask first: it's public once deployed). Local: `wrangler dev`.
name = "lastpage-api"
main = "src/index.js"
compatibility_date = "2026-10-01"

[[durable_objects.bindings]]
name = "BOX"
class_name = "Box"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Box"]

[vars]
APNS_TEAM_ID = "JLXF7642XY"
APNS_KEY_ID = "CKU3M84S88"
APNS_TOPIC = "com.akashkhanna.thelastpage"
# APNS_KEY (the .p8 contents) is a secret: `wrangler secret put APNS_KEY < AuthKey_CKU3M84S88.p8`
