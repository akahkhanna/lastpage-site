# That Last Page's small server: homework by code and by address (and, later, rooms and
# family boards). Cloudflare Workers + Durable Objects, free plan. Deploy: `wrangler deploy`
# from this folder (ask first: it's public once deployed). Local: `wrangler dev`.
name = "lastpage-api"
main = "src/index.js"
compatibility_date = "2026-10-01"

[[durable_objects.bindings]]
name = "BOX"
class_name = "Box"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Box"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Room"]

# Every evening at 6:30 pm in India: the streak nudge for browsers (src/index.js streakNudges).
[triggers]
crons = ["0 13 * * *"]

