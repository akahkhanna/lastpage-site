<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>if(location.hostname==="akahkhanna.github.io"){location.replace("https://thatlastpage.vercel.app"+location.pathname.replace(/^\/lastpage-site/,"")+location.search+location.hash)}</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your turn · That Last Page</title>
<meta name="description" content="A game from the back of the notebook, played a turn at a time by sending links. No app needed.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="That Last Page">
<meta property="og:title" content="Your turn! 🏏 ✓✗">
<meta property="og:description" content="Noughts & crosses or book cricket, a turn at a time. Tap to play, no app needed.">


<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<meta name="theme-color" content="#fbf8f0">
<script>if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}))</script>
<link rel="stylesheet" href="/site.css">
<style>
  #board { display: grid; grid-template-columns: repeat(3, 1fr); width: 100%; max-width: 300px; aspect-ratio: 1; margin: 12px 0; position: relative; background: var(--card); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  #board button { all: unset; display: flex; align-items: center; justify-content: center; font: 700 52px var(--display); cursor: pointer; aspect-ratio: 1; }
  #board button:nth-child(-n+6) { border-bottom: 2px solid var(--border); }
  #board button:not(:nth-child(3n)) { border-right: 2px solid var(--border); }
  #board button.t { color: var(--ink); } #board button.x { color: var(--red); }
  #board button.win { background: #f3e7db; }
  .status { font-size: 17px; margin: 6px 0; color: var(--ink); }
  .scoreline { color: var(--muted); font-size: 14px; margin: 4px 0; }
  .page { margin-top: 10px; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; width: 92px; height: 84px; background: #fff5d9; border: 1px solid #806444; border-radius: 6px 2px 2px 6px;
          box-shadow: 3px 4px 0 #79573032; transform: rotate(-2deg); cursor: pointer; margin-right: 16px; vertical-align: middle; }
  .page small { font: 11px var(--display); color: var(--muted); }
  .page b { font: italic 700 30px/40px var(--display); color: var(--red); }
  .call { color: var(--red); font-weight: 700; font-size: 28px; font-family: var(--display); }
  table.card { border-collapse: collapse; margin: 8px 0; font-size: 15px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; }
  table.card td { padding: 6px 12px; vertical-align: top; }
  table.card td.balls { font-size: 14px; color: var(--muted); }
  .big { color: var(--red); font: 700 italic 26px/1.2 var(--display); margin: 10px 0; }
  .note { color: var(--muted); font-size: 14px; margin: 4px 0; font-weight: 400; }
  input.name, .content input { width: 220px; display: inline-block; }
  #app > p, #app > div { margin: 0 0 10px; }
  #app button.go { display: inline-block; margin: 4px 16px 4px 0; }
  .word { font: 700 24px/1 var(--display); letter-spacing: .2em; }
</style>
</head>
<body>
<header class="site-header">
  <div class="wrap header-row">
    <a class="wordmark" href="/games/"><span class="brand-mark" aria-hidden="true"></span>That Last Page</a>
    <nav class="site-nav" aria-label="Pages">
      <a href="/games/" aria-current="page">Games</a>
      <a href="/homework/">Test papers</a>
      <a href="/board/">Family board</a>
    </nav>
  </div>
</header>
<main class="sheet"><div class="wrap content game-page">
  <a class="back" href="/games/">← Games</a>
  <h1 id="title">Your turn</h1>
  <div id="app"></div>
  <p class="pencil" id="copied" hidden>Copied. Paste it in the chat.</p>
  

<footer class="page-footer"><a href="/games/">Games</a><a href="/homework/">Test papers</a><a href="/board/">Family board</a><a href="https://apps.apple.com/app/id6831963769">The app, on iPhone</a><a href="/privacy.html">Privacy</a><a href="/">Help</a></footer>
</div></main>
<script src="play.js"></script>
<script src="../hangman/rules.js"></script>
<script src="room.js"></script>
<script src="live.js"></script>
<script src="solo.js"></script>
<script src="/push.js"></script>
<script>
(function () {
  const P = window.Play, app = document.getElementById("app");
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const NAME_KEY = "lp.name";
  let myName = (localStorage.getItem(NAME_KEY) || "").toUpperCase();
  let post = location.hash.length > 1 ? P.decode(location.hash.slice(1)) : null;
  let me = 0, opened = null, sentNote = "";

  async function send(text) {
    const url = location.origin + location.pathname + "#" + P.encode(post);
    if (navigator.share) { try { await navigator.share({ text, url }); return; } catch (e) { if (e.name === "AbortError") return; } }
    try { await navigator.clipboard.writeText(text + " " + url); } catch { prompt("Copy this:", text + " " + url); return; }
    const c = document.getElementById("copied"); c.hidden = false; setTimeout(() => (c.hidden = true), 2500);
  }
  const them = () => post.n[1 - me] || "your friend";

  // No game in the link: start one (or the link was damaged).
  function start(broken) {
    document.getElementById("title").textContent = "Play a friend";
    document.title = "Play a friend · That Last Page";
    app.innerHTML = `${broken ? '<p class="status" style="color:var(--red)">That link looks broken. Ask for it again, or start a new game:</p>' : ""}
      <p><a class="button primary" href="/games/">Pick a game <span aria-hidden="true">→</span></a> <span class="note">play the phone, or a friend live</span></p>
      <p class="status">Or take turns: make your move and send the link.</p>
      <p><label>Your name<br><input autocomplete="off" autocorrect="off" spellcheck="false" data-form-type="other" class="name" id="nm" value="${esc(myName)}" maxlength="20" placeholder="your name"></label></p>
      <button class="go" data-g="nc">Noughts & crosses →</button>
      <button class="go" data-g="bc">Book cricket →</button>`;
    app.querySelectorAll("button[data-g]").forEach((b) => b.addEventListener("click", () => {
      const nm = document.getElementById("nm").value.trim().toUpperCase().slice(0, 20) || "ME";
      myName = nm; localStorage.setItem(NAME_KEY, nm);
      post = b.dataset.g === "nc" ? { g: "nc", n: [nm, ""], b: ".........", s: "t", k: [0, 0, 0] } : { g: "bc", n: [nm, ""], p: [] };
      me = 0; opened = JSON.parse(JSON.stringify(post)); render();
    }));
  }

  // First time on this page and it's your turn: your name, for the scorecard.
  function askName() {
    app.innerHTML = `<p>${esc(post.n[1 - P.whoseTurn(post)] || "Your friend")} sent you a game of ${post.g === "nc" ? "noughts & crosses" : "book cricket"}!</p>
      <p>your name: <input autocomplete="off" autocorrect="off" spellcheck="false" data-form-type="other" class="name" id="nm" maxlength="20" placeholder="your name" autofocus></p>
      <button class="go" id="ok">play →</button>`;
    const go = () => {
      myName = (document.getElementById("nm").value.trim() || "FRIEND").toUpperCase().slice(0, 20);
      localStorage.setItem(NAME_KEY, myName); begin();
    };
    document.getElementById("ok").addEventListener("click", go);
    document.getElementById("nm").addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
  }

  function begin() {
    me = P.whoAmI(post, myName);
    if (!post.n[me]) post.n[me] = myName;
    opened = JSON.parse(JSON.stringify(post));
    render();
  }

  function render() { post.g === "nc" ? renderNC() : renderBC(); }

  // ---------- noughts & crosses ----------
  function renderNC() {
    document.getElementById("title").textContent = "Noughts & crosses";
    const mine = me === 0 ? "t" : "x", sym = (m) => (m === "t" ? "✓" : "✗");
    const turn = P.toMove(post.b, post.s), line = P.winLine(post.b), over = P.ncOver(post.b);
    const moved = post.b !== opened.b && (turn !== mine || over);
    let status;
    if (line) status = post.b[line[0]] === mine ? "you won!!" : `${esc(them())} won`;
    else if (over) status = "draw!";
    else if (turn === mine) status = `your turn: tap a square for ${sym(mine)}`;
    else status = moved ? "now send it, then wait for theirs" : `waiting for ${esc(them())}'s move…`;
    const tickName = post.n[0] || "your friend", crossName = post.n[1] || "your friend";
    app.innerHTML = `<p class="status">${status}</p><div id="board"></div>
      <p class="scoreline">${esc(tickName)} ✓ ${post.k[0]} · ${esc(crossName)} ✗ ${post.k[1]}${post.k[2] ? " · draws " + post.k[2] : ""}</p>
      <div id="acts"></div>`;
    const board = document.getElementById("board");
    [...post.b].forEach((c, i) => {
      const b = document.createElement("button");
      b.textContent = c === "." ? "" : sym(c); if (c !== ".") b.classList.add(c);
      if (line && line.includes(i)) b.classList.add("win");
      b.setAttribute("aria-label", `row ${Math.floor(i / 3) + 1}, column ${(i % 3) + 1}${c === "." ? "" : ", " + (c === "t" ? "tick" : "cross")}`);
      b.addEventListener("click", () => {
        if (over || turn !== mine || post.b[i] !== ".") return;
        post.b = post.b.slice(0, i) + mine + post.b.slice(i + 1);
        const w = P.winLine(post.b);
        if (w) post.k[post.b[w[0]] === "t" ? 0 : 1]++; else if (!post.b.includes(".")) post.k[2]++;
        render();
      });
      board.appendChild(b);
    });
    P.strike(board, line);
    const acts = document.getElementById("acts");
    if (moved) {
      acts.innerHTML += `<button class="go" id="send">send to ${esc(them())} →</button>`;
      const changed = [...post.b].map((c, i) => (c !== opened.b[i] ? i : -1)).filter((i) => i >= 0);
      if (changed.length === 1 && opened.b[changed[0]] === "." && post.s === opened.s) acts.innerHTML += ` <button class="small" id="undo">rub out</button>`;
    }
    if (over) acts.innerHTML += `<button class="go" id="again">again →</button>`;
    const on = (id, f) => { const el = document.getElementById(id); if (el) el.addEventListener("click", f); };
    on("send", () => send(over ? "Noughts & crosses: see how our game ended ✓✗" : `Your move! Noughts & crosses with ${myName} ✓✗`));
    on("undo", () => { post.b = opened.b; post.k = opened.k.slice(); render(); });
    on("again", () => { post.s = post.s === "t" ? "x" : "t"; post.b = "........."; render(); });
  }

  // ---------- book cricket ----------
  let lastPage = null, flipping = false;
  function renderBC() {
    document.getElementById("title").textContent = "Book cricket";
    const t0 = (post.n[0] || "FRIEND") + " XI", t1 = (post.n[1] || "FRIEND") + " XI";
    const first = P.innings(post.p || []), target = first.runs + 1;
    const chase = post.q ? P.innings(post.q, target) : null;
    const myInnings = (chase === null) === (me === 0);
    const cur = chase || first, curTeam = chase ? t1 : t0;
    const card = (inn, chasing) => {
      const names = chasing ? ["Dada", "Viru", "Chintu"] : ["Sachin", "Ajay", "Me"];
      const rows = inn.batters.map((bs, i) => {
        if (!bs.length && i > inn.wickets) return "";
        const name = names[i] === "Me" && !myInnings ? them() : names[i];
        const runs = bs.reduce((a, b) => a + (b === "W" ? 0 : b === "nb" ? 1 : b), 0);
        const out = bs[bs.length - 1] === "W";
        return `<tr><td><b>${esc(name)}</b></td><td class="balls">${bs.map((b) => b === "W" ? '<span style="color:var(--red)">W</span>' : b === "nb" ? "1nb" : b).join(" ")}</td><td>${bs.length ? runs + (out ? "" : "*") : "–"}</td></tr>`;
      }).join("");
      return `<table class="card">${rows}<tr><td><b>Total</b></td><td><b>${inn.runs}/${inn.wickets}</b></td><td class="note">${Math.floor(inn.legal / 6)}.${inn.legal % 6} ov</td></tr></table>`;
    };
    let html = `<p class="status"><b>${esc(t0)} vs ${esc(t1)}</b></p>`;
    if (chase) html += `<p class="note">${esc(t0)} ${first.runs}/${first.wickets} (${Math.floor(first.legal / 6)}.${first.legal % 6})</p>`;
    if (!cur.over) {
      html += `<p class="note">${chase ? `${esc(t1)} need ${Math.max(target - chase.runs, 0)} off ${18 - chase.legal}` : `${esc(t0)} batting`}</p>`;
      if (myInnings) {
        const call = lastPage == null ? "" : { W: "OUT!!", nb: "no ball! +1", 6: "6!! SIXER", 4: "4!! FOUR" }[P.ball(lastPage)] ?? P.ball(lastPage);
        html += `<div><span class="page" id="flip" role="button" aria-label="flip the book"><small>Page No.</small><b id="pg">${lastPage ?? "?"}</b></span>
          <span class="call">${call}</span><p class="note">tap the book to flip ↻</p></div>`;
      } else {
        html += `<p class="note">${esc(curTeam)} bats on their phone…</p>`;
      }
    }
    html += card(cur, !!chase);
    if (first.over && !chase) {
      html += `<p class="big" style="font-size:22px">innings over!! target ${target}</p>`;
      if (me === 0) html += `<button class="go" id="send">send it to ${esc(them())} to chase →</button><p class="note">they bat their innings (in the app, or here), then send the result back.</p>`;
      else html += `<button class="go" id="bat">our turn to bat →</button>`;
    }
    let result = "";
    if (chase && chase.over) {
      const iFirst = me === 0;
      if (chase.runs > first.runs) { const w = 3 - chase.wickets; result = `${t1} won by ${w} wkt${w === 1 ? "" : "s"}`; html += `<p class="big">${iFirst ? esc(result) : "WON!! by " + w + " wkt" + (w === 1 ? "" : "s")}</p>`; }
      else if (chase.runs === first.runs) { result = "tie!!"; html += `<p class="big">TIE!!</p>`; }
      else { const r = first.runs - chase.runs; result = `${t0} won by ${r} run${r === 1 ? "" : "s"}`; html += `<p class="big">${iFirst ? "WON!! by " + r + " run" + (r === 1 ? "" : "s") : esc(result)}</p>`; }
      if (me === 1) html += `<button class="go" id="send">send the result to ${esc(them())} →</button>`;
      else html += `<button class="go" id="new">play again →</button>`;
    }
    app.innerHTML = html;
    const on = (id, f) => { const el = document.getElementById(id); if (el) el.addEventListener("click", f); };
    on("flip", flip);
    on("bat", () => { post.q = []; lastPage = null; render(); });
    on("new", () => { post = { g: "bc", n: [myName, post.n[1 - me]], p: [] }; me = 0; opened = JSON.parse(JSON.stringify(post)); lastPage = null; render(); });
    on("send", () => send(chase && chase.over ? `Book cricket: ${result} 🏏` : `Book cricket: ${t0} made ${first.runs}/${first.wickets}. Can you chase ${target}? 🏏`));
  }
  async function flip() {
    if (flipping) return; flipping = true;
    const page = (Math.floor(Math.random() * 100) + 1) * 2;
    const pg = document.getElementById("pg");
    for (let i = 0; i < 7 && pg; i++) { pg.textContent = (Math.floor(Math.random() * 100) + 1) * 2; await new Promise((r) => setTimeout(r, 60)); }
    if (post.q) post.q.push(page); else post.p.push(page);
    lastPage = page; flipping = false; render();
  }

  // ---------- live rooms (against the app, or another browser) ----------
  function live(roomCode) {
    document.title = (roomCode ? "Join a live game" : "Start a live game") + " · That Last Page";
    document.getElementById("title").hidden = true;
    const pageBack = document.querySelector("a.back"); if (pageBack) pageBack.hidden = true;   // the panel has its own
    const T = window.Room.TITLES;
    const games = [["noughtsCrosses", "crosses"], ["bookCricket", "cricket"], ["dotsBoxes", ""], ["hangman", ""], ["bollywood", ""], ["hollywood", ""]];
    app.innerHTML = `<a class="live-back" href="/games/"><span aria-hidden="true">←</span> Games</a>
      <div class="live-panel">
        <div class="live-copy" id="liveCopy">
          <h1>${roomCode ? "Join a live game" : "Start a live game"}</h1>
          <p class="live-game-name" id="liveGame" hidden></p>
          <form class="live-form" id="liveForm">
            <label for="liveName">Your name</label>
            <input autocorrect="off" spellcheck="false" data-form-type="other" id="liveName" maxlength="20" autocomplete="off" autocapitalize="characters" enterkeyhint="go" value="${esc(myName)}" placeholder="your name" required>
            <p class="live-hint">Use the name your friend will recognise.</p>
            ${roomCode ? `<button class="button primary" type="submit">Join game <span aria-hidden="true">→</span></button>` : `
            <label>Game</label>
            <div class="mode-grid live-games">
              ${games.map(([k]) => `<button type="button" class="mode" data-live="${k}"><span><strong>${esc(T[k])}</strong></span><span class="arrow" aria-hidden="true">→</span></button>`).join("")}
              <button type="button" class="mode" data-live="namePlace"><span><strong>${esc(T.namePlace)}</strong><small>with <select id="npl" aria-label="players">${[2, 3, 4, 5, 6, 7, 8].map((n) => `<option value="${n}">${n} players</option>`).join("")}</select></small></span><span class="arrow" aria-hidden="true">→</span></button>
            </div>
            <p class="live-hint">They join in the app or any browser, by link or by name if you're in a family together.</p>`}
          </form>
          <section class="live-state" id="liveWaiting" hidden></section>
        </div>
        <div class="live-art" id="liveArt" data-game="crosses" aria-hidden="true">
          <span class="live-grid"><span class="xo"><span class="x">×</span><span></span><span>○</span><span></span><span class="x">×</span><span></span><span>○</span><span></span><span></span></span></span>
          <span class="book"><i><b>42</b></i><i><b>43</b></i></span>
        </div>
      </div>`;
    const nameIn = document.getElementById("liveName");
    const takeName = () => { const n = nameIn.value.trim().toUpperCase().slice(0, 20); if (!n) { nameIn.setCustomValidity("Enter your name to join."); nameIn.reportValidity(); return null; } myName = n; localStorage.setItem(NAME_KEY, n); return n; };
    nameIn.addEventListener("input", () => nameIn.setCustomValidity(""));
    const art = (k) => { document.getElementById("liveArt").dataset.game = k === "bookCricket" ? "cricket" : "crosses"; };
    if (roomCode) {
      // Which game, and who's there, before asking for a name.
      window.Room.api("GET", "/r/" + roomCode).then((info) => {
        const g = document.getElementById("liveGame"); g.hidden = false;
        const here = (info.members || []).filter((m) => m.here).map((m) => m.label);
        g.textContent = (T[info.game] || "A live game") + (here.length ? ` · ${here.join(", ")} ${here.length === 1 ? "is" : "are"} waiting` : "");
        art(info.game);
      }).catch((e) => {
        // No such room (it's over, or the code's mistyped): say so instead of joining for ever.
        if (!/no such room|not a code/i.test(e.message)) return;
        document.getElementById("liveForm").hidden = true;
        const h1 = document.querySelector("#liveCopy h1"); if (h1) h1.hidden = true;
        const w = document.getElementById("liveWaiting"); w.hidden = false;
        w.innerHTML = `<h2>That game has ended</h2><p class="live-hint">Or the link is wrong. Ask them for a new one, or start your own.</p><p><a class="button primary" href="/games/">Pick a game <span aria-hidden="true">→</span></a></p>`;
      });
      document.getElementById("liveForm").addEventListener("submit", (e) => { e.preventDefault(); const n = takeName(); if (n) window.Room.run(app, roomCode, n); });
    } else {
      document.getElementById("liveForm").addEventListener("submit", (e) => e.preventDefault());
      app.querySelectorAll("[data-live]").forEach((b) => b.addEventListener("click", () => {
        const n = takeName(); if (!n) return;
        art(b.dataset.live);
        window.Room.start(app, b.dataset.live, n, b.dataset.live === "namePlace" ? parseInt(document.getElementById("npl").value, 10) : 2);
      }));
    }
    document.addEventListener("click", (e) => { if (e.target.closest("#liveEdit")) { localStorage.removeItem(NAME_KEY); location.reload(); } });
  }

  // ---------- one game's page: play the phone, a friend live, or turns by link ----------
  // A tile on the games page opens here with ?g=<game>, so the game is never asked for twice.
  const INFO = {
    noughtsCrosses: { title: "Noughts & crosses", rule: "Three in a row before they do.", solo: true, turns: "nc", art: "crosses" },
    bookCricket: { title: "Book cricket", rule: "Open the book anywhere: the last digit of the page is your runs. 0 is out.", solo: true, turns: "bc", art: "cricket" },
    dotsBoxes: { title: "Dots & boxes", rule: "Join two dots. Close a box and you go again.", solo: true, art: "crosses" },
    hangman: { title: "Hangman & films", rule: "Guess it letter by letter: a word, or a Bollywood or Hollywood film.", solo: true, word: true, art: "crosses" },
    namePlace: { title: "Name Place Animal Thing", rule: "One letter, everyone writes at once. 2 to 8 players.", players: true, art: "crosses" },
  };
  function gamePage(kind) {
    const G = INFO[kind];
    if (!G) { location.replace("/games/"); return; }
    document.getElementById("title").hidden = true;
    const pageBack = document.querySelector("a.back"); if (pageBack) pageBack.hidden = true;
    document.title = G.title + " · That Last Page";
    let variant = G.word ? (localStorage.getItem("lp.wordGame") || "hangman") : kind;
    const action = (act, title, small, extra = "") => `<button type="button" class="mode" data-act="${act}"><span><strong>${title}</strong><small>${small}</small>${extra}</span><span class="arrow" aria-hidden="true">→</span></button>`;
    app.innerHTML = `<a class="live-back" href="/games/"><span aria-hidden="true">←</span> Games</a>
      <div class="live-panel">
        <div class="live-copy" id="liveCopy">
          <h1>${esc(G.title)}</h1>
          <p class="live-hint" style="font-size:15px">${esc(G.rule)}</p>
          ${G.word ? `<div class="pill-row" role="radiogroup" aria-label="Which one">${[["hangman", "Hangman"], ["bollywood", "Bollywood"], ["hollywood", "Hollywood"]].map(([k, t]) => `<button type="button" class="pill${k === variant ? " on" : ""}" role="radio" aria-checked="${k === variant}" data-variant="${k}">${t}</button>`).join("")}</div>` : ""}
          <form class="live-form" id="liveForm" onsubmit="return false">
            <label for="liveName">Your name</label>
            <input data-form-type="other" id="liveName" maxlength="20" autocomplete="off" autocorrect="off" spellcheck="false" autocapitalize="characters" enterkeyhint="done" value="${esc(myName)}" placeholder="your name" required>
            <div class="mode-grid live-games">
              ${G.solo ? action("solo", "Play the phone", "Right here, on your own.") : ""}
              ${action("live", "Play a friend, live", "Send them a link. They play in the app or any browser.",
                G.players ? ` <small>with <select id="npl" aria-label="players">${[2, 3, 4, 5, 6, 7, 8].map((n) => `<option value="${n}">${n} players</option>`).join("")}</select></small>` : "")}
              ${G.turns ? action("turns", "Take turns by link", "Make your move and send it. They reply whenever.") : ""}
              ${G.word ? action("link", "Send a word by link", "Write a word or film; they guess it from the link.") : ""}
            </div>
          </form>
          <section class="live-state" id="liveWaiting" hidden></section>
        </div>
        <div class="live-art" id="liveArt" data-game="${G.art}" aria-hidden="true">
          <span class="live-grid"><span class="xo"><span class="x">×</span><span></span><span>○</span><span></span><span class="x">×</span><span></span><span>○</span><span></span><span></span></span></span>
          <span class="book"><i><b>42</b></i><i><b>43</b></i></span>
        </div>
      </div>`;
    app.querySelectorAll("[data-variant]").forEach((b) => b.addEventListener("click", () => {
      variant = b.dataset.variant; localStorage.setItem("lp.wordGame", variant);
      app.querySelectorAll("[data-variant]").forEach((x) => { x.classList.toggle("on", x === b); x.setAttribute("aria-checked", String(x === b)); });
    }));
    const nameIn = document.getElementById("liveName");
    nameIn.addEventListener("input", () => nameIn.setCustomValidity(""));
    const takeName = () => { const n = nameIn.value.trim().toUpperCase().slice(0, 20); if (!n) { nameIn.setCustomValidity("Write your name first."); nameIn.reportValidity(); return null; } myName = n; localStorage.setItem(NAME_KEY, n); return n; };
    app.querySelectorAll("[data-act]").forEach((b) => b.addEventListener("click", (e) => {
      if (e.target.closest("select")) return;
      const act = b.dataset.act;
      if (act === "link") {
        const typed = nameIn.value.trim(); if (typed) { localStorage.setItem("lp.from", typed); localStorage.setItem(NAME_KEY, typed.toUpperCase()); }
        location.href = "/hangman/?m=" + ({ hangman: "h", bollywood: "b", hollywood: "y" }[variant]); return;
      }
      const n = takeName(); if (!n) return;
      if (act === "solo") return solo(G.word ? variant : kind, n);
      if (act === "live") return window.Room.start(app, G.word ? variant : kind, n, G.players ? parseInt(document.getElementById("npl").value, 10) : 2);
      if (act === "turns") {
        post = G.turns === "nc" ? { g: "nc", n: [n, ""], b: ".........", s: "t", k: [0, 0, 0] } : { g: "bc", n: [n, ""], p: [] };
        me = 0; opened = JSON.parse(JSON.stringify(post));
        const back = document.querySelector("a.back"); back.hidden = false; back.href = location.pathname + location.search; back.textContent = "← " + G.title;
        document.getElementById("title").hidden = false;
        render();
      }
    }));
  }
  // "Change name" on the waiting screen.
  document.addEventListener("click", (e) => { if (e.target.closest("#liveEdit") && new URLSearchParams(location.search).get("g")) { localStorage.removeItem(NAME_KEY); location.reload(); } });
  function solo(kind, name) {
    const T = window.Room.TITLES;
    app.innerHTML = `<a class="live-back" href="${location.pathname}${location.search}"><span aria-hidden="true">←</span> ${esc(INFO[kind] ? INFO[kind].title : "Hangman & films")}</a>
      <h1 style="font-size:clamp(32px,5vw,48px)">${esc(T[kind] || "")}</h1>
      <p class="live-hint">${esc(name)} vs the phone · <button class="text-button" type="button" id="soloNew">new game</button></p>
      <div id="soloGame"></div>`;
    const go = () => window.Solo.start(document.getElementById("soloGame"), kind, name, go);
    document.getElementById("soloNew").addEventListener("click", go);
    go();
  }

  // Another link opened in the same tab: start again with that game.
  addEventListener("hashchange", () => location.reload());
  const h = location.hash.slice(1), g = new URLSearchParams(location.search).get("g");
  if (/^r-[A-HJ-NP-Z2-9]{6}$/i.test(h)) live(h.slice(2));
  else if (g && !h) gamePage(g);
  else if (h === "live" || !h) location.replace("/games/");   // every game has its own page now
  else if (!post) start(true);
  else if (!post.n[P.whoseTurn(post)] && !myName) askName();
  else begin();
})();
</script>
</body>
</html>
