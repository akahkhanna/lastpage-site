<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>if(location.hostname==="akahkhanna.github.io"){location.replace("https://thatlastpage.vercel.app"+location.pathname.replace(/^\/lastpage-site/,"")+location.search+location.hash)}</script>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hangman &amp; films · That Last Page</title>
<meta name="description" content="Someone sent you a hangman or film challenge. Can you guess it?">
<meta property="og:type" content="website">
<meta property="og:site_name" content="That Last Page">
<meta property="og:title" content="Can you guess it?">
<meta property="og:description" content="A hangman / Bollywood / Hollywood challenge from the back of the notebook. Open it and play.">
<meta property="og:image" content="https://thatlastpage.vercel.app/hangman/preview.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">

<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<meta name="theme-color" content="#fbf8f0">
<script>if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}))</script>
<link rel="stylesheet" href="/site.css">
<link rel="stylesheet" href="hangman.css">
</head>
<body>
<header class="site-header">
  <div class="wrap header-row">
    <a class="wordmark" href="/games/"><span class="brand-mark" aria-hidden="true"></span>That Last Page</a>
    <nav class="site-nav" aria-label="Pages">
      <a href="/games/" aria-current="page">Games</a>
      <a href="/homework/">Test papers</a>
      <a href="/board/">Family board</a>
    </nav>
  </div>
</header>
<main class="sheet"><div class="wrap content game-page"><a class="back" href="/games/">← Games</a>

  <!-- Make a challenge -->
  <section id="make" hidden>
    <h1>Hangman &amp; films</h1>
    <p class="pencil">write a secret word or film, send the link, and see who gets it</p>
    <div class="modes" role="radiogroup" aria-label="Game">
      <button class="mode on" data-mode="h" role="radio" aria-checked="true">Hangman</button>
      <button class="mode" data-mode="b" role="radio" aria-checked="false">Bollywood</button>
      <button class="mode" data-mode="y" role="radio" aria-checked="false">Hollywood</button>
    </div>
    <label><span class="pencil" id="secretLabel">secret word (they won't see it)</span>
      <input autocorrect="off" data-form-type="other" id="secret" type="password" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="40"></label>
    <button id="peek" class="small">show</button>
    <label id="hintRow"><span class="pencil">hint (optional), e.g. food, animal</span>
      <input autocorrect="off" spellcheck="false" data-form-type="other" id="hint" autocomplete="off" maxlength="20"></label>
    <label><span class="pencil">your name</span>
      <input autocorrect="off" spellcheck="false" data-form-type="other" id="from" autocomplete="off" autocapitalize="characters" maxlength="20"></label>
    <p class="slots" id="preview" aria-hidden="true"></p>
    <button id="makeLink" class="red" disabled>send the challenge →</button>
    <p class="pencil" id="copied" hidden>link copied!! paste it in the chat</p>
  </section>

  <!-- Play a challenge -->
  <section id="play" hidden>
    <h1 id="playTitle">hangman</h1>
    <p class="pencil" id="from-line"></p>
    <div id="picture"></div>
    <p class="hint" id="hintLine" hidden></p>
    <p class="slots" id="slots" aria-live="polite"></p>
    <p class="pencil" id="left"></p>
    <div class="keys" id="keys"></div>
    <div id="end" hidden>
      <p class="result" id="result"></p>
      <button id="sendBack" class="red">tell them how you did →</button>
      <p class="pencil" id="copied2" hidden>copied!! paste it in the chat</p>
      <button id="own" class="ink small">make your own challenge</button>
    </div>
  </section>

  

<footer class="page-footer"><a href="/games/">Games</a><a href="/homework/">Test papers</a><a href="/board/">Family board</a><a href="https://apps.apple.com/app/id6831963769">The app, on iPhone</a><a href="/privacy.html">Privacy</a><a href="/">Help</a></footer>
</div></main>
<script src="rules.js"></script>
<script src="hangman.js"></script>
<script src="/push.js"></script>
</body>
</html>
